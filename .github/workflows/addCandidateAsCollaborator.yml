name: Add candidate as collaborator

on:
  workflow_call:
    inputs:
      candidate_name:
        type: string
        description: "Candidate name"
        required: true
      candidate_github:
        type: string
        description: "Candidate username (Github)"
        required: true
      test_type:
        type: string
        description: "Type of test (js, py, java, swift, kotlin, ts)"
        required: true

jobs:
  add_collaborator:
    name: Add collaborator
    runs-on: ubuntu-latest
    env:
      ORG_NAME: "theodo-join-us"
    steps:
      - name: Define CUSTOM_REPO_NAME env variable
        run: echo "CUSTOM_REPO_NAME=test-hokla-aphp-${{inputs.test_type}}-${{ inputs.candidate_name }}" | sed 's/\"//g' >> $GITHUB_ENV

      - name: Add candidate as collaborator
        run: |
          CANDIDATE_GITHUB="${{ inputs.candidate_github }}"

          curl -f -X PUT -H "Authorization: token ${{ secrets.JOIN_US_FORK_INVIT_SECRET }}" \
               -H "Accept: application/vnd.github.v3+json" \
               https://api.github.com/repos/$ORG_NAME/$CUSTOM_REPO_NAME/collaborators/$CANDIDATE_GITHUB \
               -d '{"permission": "write"}'

      - name: Cleanup repository if invite failed
        if: failure()
        run: |
          echo "Invite failed, deleting $ORG_NAME/$CUSTOM_REPO_NAME so the next attempt can recreate it"
          curl -s -o /dev/null -w "%{http_code}\n" -X DELETE \
               -H "Authorization: token ${{ secrets.JOIN_US_FORK_INVIT_SECRET }}" \
               -H "Accept: application/vnd.github.v3+json" \
               https://api.github.com/repos/$ORG_NAME/$CUSTOM_REPO_NAME
